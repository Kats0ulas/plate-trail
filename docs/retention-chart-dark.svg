<svg xmlns="http://www.w3.org/2000/svg" width="660" height="466" viewBox="0 0 660 466" role="img" aria-labelledby="t d">
<title id="t">Real places found by the observer, by retention period</title>
<desc id="d">Athens sample, same observer at the end of the data. 48 hours (Ban Flock Act): 2 of 11 places, rally missed; 7 days (Flock default): 4 of 11 places, rally missed; 10 days (Stop Flock Abuse Act): 5 of 11 places, rally missed; 21 days (Connecticut): 7 of 11 places, rally found; 30 days (Flock before Aug 2026): 11 of 11 places, rally found; Forever (No limit): 11 of 11 places, rally found.</desc>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<text x="0" y="24" font-size="22" font-weight="700" fill="#f0f6fc">How much of Nikos’s life the cameras give away</text>
<text x="0" y="50" font-size="14.5" fill="#9198a1">Places found from camera reads alone. Each square is one of his 11 real places.</text>
